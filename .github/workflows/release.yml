name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    name: Build Tauri app (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src-ui/package-lock.json

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tauri-release-windows

      - name: Build UI
        working-directory: src-ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (release)
        run: cargo tauri build

      - name: Package artifacts
        shell: pwsh
        run: |
          $ts = Get-Date -Format "yyyyMMdd-HHmmss"
          $staging = "staging-$ts"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          # Tauri output paths
          Copy-Item -Path "src-tauri/target/release/bundle/msi/*.msi" -Destination $staging -ErrorAction SilentlyContinue
          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination $staging -ErrorAction SilentlyContinue
          Copy-Item -Path "src-tauri/target/release/*.exe" -Destination $staging -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging/*" -DestinationPath "rdw-windows-$env:GITHUB_REF_NAME.zip" -Force
          Get-ChildItem $staging

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdw-windows-release
          path: |
            *.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rdw-windows-release
          path: release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.msi
            release/*.exe
          draft: true
          generate_release_notes: true
          name: ${{ github.ref_name }}
